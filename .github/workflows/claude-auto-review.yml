name: Claude Auto Review

# PR を Claude Opus 5.5 が自動レビューし、指摘ゼロなら squash マージ、改善提案や問題があれば理由をコメントする。
# 処理本体とレビュー手順は sakadukigi/claude-auto-review-template に一元化されている（このファイルは呼び出すだけ）。
# 動作にはリポジトリシークレット CLAUDE_CODE_OAUTH_TOKEN が必要（未登録ならスキップ）。

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-auto-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write       # squash マージ・ブランチ削除
  pull-requests: write  # マージ・PR 情報取得
  issues: write         # PR コメント投稿

jobs:
  review:
    uses: sakadukigi/claude-auto-review-template/.github/workflows/review.yml@main
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
