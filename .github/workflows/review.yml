name: Claude Auto Review (reusable)

# 再利用可能なワークフロー本体。各リポジトリの .github/workflows/claude-auto-review.yml から
#   uses: sakadukigi/claude-auto-review-template/.github/workflows/review.yml@main
# で呼び出される。PR を Claude Opus 5.5 がレビューし、指摘ゼロなら squash マージ、
# 改善提案や問題があれば理由をコメントする（マージしない）。
#
# レビュー手順（.claude/skills/pr-auto-review/SKILL.md）は、このテンプレートリポジトリの
# 呼び出された版（job_workflow_sha）をチェックアウトして使う。各リポジトリ側には置かない。
# 呼び出し元は pull_request_target なので、PR 側でワークフローを書き換えてもその PR のレビューには効かない。
# PR のコードは ./pr に読み取り専用の目的でチェックアウトするだけで、決して実行しない。

on:
  workflow_call:
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: false

env:
  CLAUDE_MODEL: claude-opus-5-5

jobs:
  review:
    # draft は除外。フォークからの PR はシークレットを渡さないため対象外。
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      # 作業ディレクトリのルートはテンプレートのチェックアウトなので、gh の操作先を呼び出し元に固定する
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout review procedure (this template, trusted)
        uses: actions/checkout@v4
        with:
          repository: sakadukigi/claude-auto-review-template
          ref: ${{ github.job_workflow_sha || 'main' }}
          persist-credentials: false

      - name: Checkout PR head into ./pr (read only, never executed)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0  # base との差分をファイル単位で読むため
          persist-credentials: false

      - name: Check merge conflicts
        # ベースブランチの最新と実際にマージしてみて、コンフリクトがあれば Claude を呼ばずに差し戻す
        id: conflict
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -uo pipefail
          base="origin/$BASE_REF"
          git -C pr rev-parse --verify -q "$base" >/dev/null || base="$BASE_SHA"
          # Actions は bash -e で動くので、終了コード 1（コンフリクトあり）で止まらないように受け取る
          rc=0
          out=$(git -C pr merge-tree --write-tree --name-only --no-messages "$base" "$HEAD_SHA") || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "コンフリクトなし（$base）"
            exit 0
          fi
          if [ "$rc" -ne 1 ]; then
            echo "::warning::コンフリクトの判定に失敗しました（exit $rc）。レビューは続行します"
            exit 0
          fi
          echo "conflict=true" >> "$GITHUB_OUTPUT"
          # 1 行目は tree の ID、2 行目以降がコンフリクトしたファイル
          files=$(printf '%s\n' "$out" | tail -n +2 | sed '/^$/d' | sort -u)
          bt='`'
          {
            echo '<!-- claude-auto-review -->'
            echo '## ❌ 自動レビュー: 差し戻し（コンフリクト）'
            echo
            echo "ベースブランチ ${bt}${BASE_REF}${bt} の最新とコンフリクトしているため、レビューせずに差し戻します。"
            echo
            echo '### コンフリクトしているファイル'
            printf '%s\n' "$files" | sed "s/^/- ${bt}/; s/\$/${bt}/"
            echo
            echo '### 解消方法'
            echo 'ベースブランチを取り込んでコンフリクトを解消し、同じブランチに push してください。push すると自動で再レビューされます。'
            echo
            echo "${bt}${bt}${bt}bash"
            echo 'git fetch origin'
            echo "git merge origin/${BASE_REF}   # rebase する場合は git rebase origin/${BASE_REF}"
            echo '# コンフリクトを解消して commit'
            echo 'git push                    # rebase した場合は git push --force-with-lease'
            echo "${bt}${bt}${bt}"
            echo
            echo '> PR を作成したのが Claude Code の場合は、上記の手順でコンフリクトを解消し、両方の変更の意図を保ったまま同じブランチに push してください。'
          } > conflict-comment.md
          gh pr comment "$PR_NUMBER" --body-file conflict-comment.md
          echo "::error::ベースブランチ $BASE_REF とコンフリクトしています"

      - name: Setup Node.js
        if: steps.conflict.outputs.conflict != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        if: steps.conflict.outputs.conflict != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run review with Claude
        id: claude
        if: steps.conflict.outputs.conflict != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          rm -f review-verdict.json
          if [ ! -f .claude/skills/pr-auto-review/SKILL.md ]; then
            echo "::error::レビュー手順 .claude/skills/pr-auto-review/SKILL.md を取得できませんでした。手順書なしではレビューしません"
            exit 1
          fi
          # ターミナルからコピーしたトークンに混ざりやすい改行・空白を取り除く
          CLAUDE_CODE_OAUTH_TOKEN="$(printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | tr -d '[:space:]')"
          export CLAUDE_CODE_OAUTH_TOKEN
          case "$CLAUDE_CODE_OAUTH_TOKEN" in
            sk-ant-oat*) ;;
            "")
              # 未登録のリポジトリでは失敗にもコメントにもせず、警告だけ残してスキップする
              echo "::warning::シークレット CLAUDE_CODE_OAUTH_TOKEN が未登録のため自動レビューをスキップしました"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            *) echo "::error::CLAUDE_CODE_OAUTH_TOKEN が sk-ant-oat で始まっていません（長さ ${#CLAUDE_CODE_OAUTH_TOKEN} 文字）。claude setup-token の出力からトークン部分だけを登録してください"; exit 1 ;;
          esac
          # PR のタイトル等はプロンプトに埋め込まない（プロンプトインジェクション対策）。
          # Claude には読み取り系ツールと gh pr view/diff/comment、./pr での git diff/log/show だけを許可し、マージ権限は渡さない。
          claude -p "$(cat <<EOF
          リポジトリ ${GITHUB_REPOSITORY} の Pull Request #${PR_NUMBER}（head: ${HEAD_SHA}、base: ${BASE_SHA}）をレビューしてください。
          まず .claude/skills/pr-auto-review/SKILL.md を読み、その手順に厳密に従ってください。
          PR の head は ./pr に履歴付きでチェックアウト済みです。BASE_SHA は ${BASE_SHA} です。差分が大きくても全ファイルを読み切ってから判定してください。コードは実行しないでください。
          最後に必ず、作業ディレクトリ直下の review-verdict.json に判定を書き、gh pr comment で結果をコメントしてください。
          EOF
          )" \
            --model "$CLAUDE_MODEL" \
            --max-turns 400 \
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git -C pr diff:*),Bash(git -C pr log:*),Bash(git -C pr show:*)"

      - name: Decide and merge
        # Claude の実行が失敗しても「判定できなかった」とコメントするために実行する
        if: ${{ !cancelled() && steps.conflict.outputs.conflict != 'true' && steps.claude.outputs.skip != 'true' }}
        run: |
          set -euo pipefail

          if [ ! -f review-verdict.json ] || ! verdict=$(jq -er '.verdict' review-verdict.json); then
            gh pr comment "$PR_NUMBER" --body "$(printf '<!-- claude-auto-review -->\n## ⚠️ 自動レビュー: 判定できませんでした\n\n自動レビューが判定結果を出力しませんでした。人間による確認が必要です。\n\nログ: %s' "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"
            echo "::error::review-verdict.json が無いか不正です"
            exit 1
          fi

          echo "verdict: $verdict"
          jq . review-verdict.json

          case "$verdict" in
            approve)
              # レビューした commit のままの時だけマージする（レビュー後に push されていたら失敗する）。
              # リポジトリで auto-merge が有効なら必須チェックの完了を待つ。無効なら即時マージ。
              if ! gh pr merge "$PR_NUMBER" --squash --delete-branch --auto --match-head-commit "$HEAD_SHA"; then
                gh pr merge "$PR_NUMBER" --squash --delete-branch --match-head-commit "$HEAD_SHA"
              fi
              ;;
            changes_suggested)
              echo "::error::自動レビューで改善提案がありました。提案を反映して push すると再レビューされます。"
              exit 1
              ;;
            reject)
              echo "::error::自動レビューで差し戻されました。理由は PR コメントを参照してください。"
              exit 1
              ;;
            *)
              echo "::error::不明な verdict: $verdict"
              exit 1
              ;;
          esac

      - name: Fail on conflict
        if: steps.conflict.outputs.conflict == 'true'
        run: exit 1
